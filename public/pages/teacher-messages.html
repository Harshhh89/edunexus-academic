<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Messages | EduNexus Academic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body data-required-role="teacher">
    <nav class="navbar navbar-expand-lg dashboard-nav">
      <div class="container">
        <a class="navbar-brand fw-bold text-decoration-none" href="/pages/teacher-dashboard.html">EduNexus Academic</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-dark" href="/pages/teacher-dashboard.html">Back to Dashboard</a>
          <button class="btn btn-outline-dark" data-logout>Logout</button>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <section class="dashboard-header p-4 p-md-5 mb-4">
        <p class="eyebrow mb-2">Messages</p>
        <h1 class="fw-bold mb-2">Talk with parents</h1>
        <p id="welcomeText" class="mb-2 text-secondary">Loading your account...</p>
        <p class="mb-0 text-secondary">Teachers can create and reply to threads only for students in their assigned classes and subjects.</p>
      </section>
      <div id="teacherMessagesAlert" class="alert d-none" role="alert"></div>
      <section class="admin-section mb-4">
        <form id="teacherThreadForm" class="row g-3">
          <div class="col-md-5">
            <label class="form-label" for="teacherStudentOption">Student and parent</label>
            <select id="teacherStudentOption" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="teacherThreadSubject">Subject</label>
            <select id="teacherThreadSubject" class="form-select"></select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Start Conversation</button>
          </div>
        </form>
      </section>
      <div id="teacherThreadsContainer" class="row g-4"></div>
    </main>
    <script src="/js/dashboard.js"></script>
    <script src="/js/teacher-messages.js"></script>
  </body>
</html>
