<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parent Timetable | EduNexus Academic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body data-required-role="parent">
    <nav class="navbar navbar-expand-lg dashboard-nav">

        <a class="navbar-brand fw-bold text-decoration-none" href="/pages/parent-dashboard.html">EduNexus Academic</a>
